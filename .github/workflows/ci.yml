name: 编译和测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    # 生成"这个安装程序是本仓库 GitHub 编译的"证明要用（只用于这一件事）
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 缓存词库源数据
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-${{ hashFiles('tools/fetch-data.sh') }}

      - name: 下载词库源数据（固定版本 + 校验码）
        shell: bash
        run: tools/fetch-data.sh

      - name: 准备 Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          if [ "$RUNNER_OS" = "Windows" ]; then rustup target add i686-pc-windows-msvc; fi
          rustc --version

      - name: 检查格式和代码规范
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --locked --release --workspace --all-targets -- -D warnings

      - name: 安全检查：只用审查过的依赖，源码里没有联网、剪贴板、动态加载
        shell: bash
        run: tools/check-safety.sh

      - name: 编译词库
        shell: bash
        run: cargo run --locked --release -p dictgen

      - name: 下载语言模型（本仓库 Releases，核对校验码）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-lm.sh

      - name: 测试（包括打字回归测试和长时间内存测试）
        shell: bash
        env:
          REQUIRE_DICT: "1"
        run: cargo test --locked --release --workspace -- --nocapture

      # ---------------- 下面只在 Windows 上：编译、检查、打包安装程序 ----------------

      - name: 安全测试：商店应用沙箱里能用输入法，但冒充不了引擎
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --locked --release -p pinyin-winpipe --test sandbox -- --ignored --nocapture --test-threads=1

      - name: 编译 Windows 程序（引擎、设置页、64 位和 32 位输入法 DLL）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --locked --release -p pinyin-winsrv -p pinyin-settings
          cargo build --locked --release -p pinyin-tsf --target x86_64-pc-windows-msvc
          cargo build --locked --release -p pinyin-tsf --target i686-pc-windows-msvc

      - name: 检查 DLL 的入口名和依赖（不依赖 VC++ 运行库）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dlls = "target\x86_64-pc-windows-msvc\release\pinyin_tsf.dll", "target\i686-pc-windows-msvc\release\pinyin_tsf.dll"
          foreach ($d in $dlls) {
            $out = & $dumpbin /nologo /exports $d | Out-String
            Write-Host $out
            foreach ($n in "DllGetClassObject", "DllCanUnloadNow", "DllRegisterServer", "DllUnregisterServer") {
              if ($out -notmatch "\s$n(\s|$)") { throw "$d 没有导出 $n（32 位要求不带 @ 修饰）" }
            }
          }
          foreach ($f in $dlls + "target\release\pinyin-engine.exe", "target\release\pinyin-settings.exe") {
            $deps = & $dumpbin /nologo /dependents $f | Out-String
            Write-Host $deps
            if ($deps -match "(?i)vcruntime|msvcp|api-ms-win-crt") { throw "$f 依赖 VC++ 运行库" }
          }

      - name: 安全检查：程序文件里没有联网、没有剪贴板
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $files = "target\x86_64-pc-windows-msvc\release\pinyin_tsf.dll", "target\i686-pc-windows-msvc\release\pinyin_tsf.dll",
                   "target\release\pinyin-engine.exe", "target\release\pinyin-settings.exe"
          # 能联网的系统模块
          $net = "ws2_32", "wsock32", "mswsock", "winhttp", "wininet", "urlmon", "dnsapi", "iphlpapi", "webio", "httpapi",
                 "websocket", "winnsi", "netapi32", "mpr", "rasapi32", "qmgr", "bitsproxy"
          # 剪贴板接口（读、写、监视剪贴板）
          $clip = "OpenClipboard", "GetClipboardData", "SetClipboardData", "EmptyClipboard", "AddClipboardFormatListener",
                  "SetClipboardViewer", "GetClipboardSequenceNumber", "GetClipboardOwner", "EnumClipboardFormats",
                  "IsClipboardFormatAvailable", "CountClipboardFormats", "GetOpenClipboardWindow", "GetUpdatedClipboardFormats",
                  "GetPriorityClipboardFormat", "OleGetClipboard", "OleSetClipboard", "OleFlushClipboard"
          # 用名字动态调用的系统功能（联网、剪贴板）
          $winrt = "Windows.Networking", "Windows.Web.Http", "Windows.ApplicationModel.DataTransfer"
          foreach ($f in $files) {
            $imports = & $dumpbin /nologo /imports $f | Out-String
            foreach ($d in $net) { if ($imports -match "(?im)^\s+$d\.dll") { throw "$f 用了联网模块 $d.dll" } }
            foreach ($c in $clip) { if ($imports -match "\b$c\b") { throw "$f 用了剪贴板接口 $c" } }
            # 程序里有没有藏着这些名字（不经过导入表、运行时才加载的那种）：按 ASCII 和 UTF-16 都找
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            $texts = @([Text.Encoding]::ASCII.GetString($bytes),
                       [Text.Encoding]::Unicode.GetString($bytes),
                       [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1))
            foreach ($t in $texts) {
              foreach ($d in $net) { if ($t -match "(?i)\b$d\.dll") { throw "$f 里有联网模块的名字 $d.dll" } }
              foreach ($c in $clip + $winrt) { if ($t.Contains($c)) { throw "$f 里有 $c" } }
            }
            Write-Host "✓ $f：不联网、不碰剪贴板"
          }

      - name: 注册输入法 DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tip = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\{4D576843-6F05-43DC-B08F-FC06AE6D83F7}"
          $pairs = @(("$env:WINDIR\System32\regsvr32.exe", "target\x86_64-pc-windows-msvc\release\pinyin_tsf.dll"),
                     ("$env:WINDIR\SysWOW64\regsvr32.exe", "target\i686-pc-windows-msvc\release\pinyin_tsf.dll"))
          foreach ($p in $pairs) {
            $r = Start-Process $p[0] -ArgumentList "/s", (Resolve-Path $p[1]) -Wait -PassThru
            if ($r.ExitCode -ne 0) { throw "注册失败：$($p[1])（$($r.ExitCode)）" }
          }
          if (-not (Test-Path "$tip\LanguageProfile\0x00000804")) { throw "TSF 里没有登记" }
          Get-ChildItem $tip -Recurse | Out-Host

      - name: 让 Windows 自己加载并激活输入法
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: cargo test --locked --release -p pinyin-tsf --test com -- --ignored --nocapture

      - name: 注销输入法 DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tip = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\{4D576843-6F05-43DC-B08F-FC06AE6D83F7}"
          $pairs = @(("$env:WINDIR\System32\regsvr32.exe", "target\x86_64-pc-windows-msvc\release\pinyin_tsf.dll"),
                     ("$env:WINDIR\SysWOW64\regsvr32.exe", "target\i686-pc-windows-msvc\release\pinyin_tsf.dll"))
          foreach ($p in $pairs) {
            $r = Start-Process $p[0] -ArgumentList "/u", "/s", (Resolve-Path $p[1]) -Wait -PassThru
            if ($r.ExitCode -ne 0) { throw "注销失败：$($p[1])（$($r.ExitCode)）" }
          }
          if (Test-Path "$tip\LanguageProfile\0x00000804") { throw "注销后还在" }

      - name: 整理安装文件
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rm -rf dist && mkdir -p dist/stage/data
          cp target/release/pinyin-engine.exe target/release/pinyin-settings.exe dist/stage/
          cp target/x86_64-pc-windows-msvc/release/pinyin_tsf.dll dist/stage/pinyin-tsf64.dll
          cp target/i686-pc-windows-msvc/release/pinyin_tsf.dll dist/stage/pinyin-tsf32.dll
          cp assets/icon/pinyin.ico dist/stage/
          cp assets/icon/pinyin-256.png dist/stage/pinyin.png
          cp data/build/pinyin.dict data/build/english.tsv data/build/pinyin.lm dist/stage/data/
          ls -la dist/stage dist/stage/data

      - name: 生成安装程序
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Host }
          & $iscc /Q "/DAppVer=0.1.${{ github.run_number }}" installer\pinyin.iss
          if ($LASTEXITCODE -ne 0) { throw "生成安装程序失败" }
          Get-ChildItem dist\*.exe | Out-Host

      # 证明"这个安装程序是本仓库在 GitHub 上编译的"：
      # gh attestation verify PinyinIME-Setup-x.exe -R chuhao11/pinyin-ime
      - name: 生成安装程序的来源证明
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/PinyinIME-Setup-*.exe

      - name: 试装、检查、再卸载（在 CI 的虚拟机里）
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $clsid = "{4D576843-6F05-43DC-B08F-FC06AE6D83F7}"
          $tip = "HKLM:\SOFTWARE\Microsoft\CTF\TIP\$clsid"
          $app = "$env:ProgramFiles\PinyinIME"
          $setup = Get-ChildItem dist\PinyinIME-Setup-*.exe | Select-Object -First 1
          # 只等安装程序本身（-Wait 会连它启动的引擎一起等，引擎常驻就永远等不完）
          $r = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=dist\install.log" -PassThru
          if (-not $r.WaitForExit(600000)) { throw "安装超过 10 分钟" }
          if ($r.ExitCode -ne 0) { Get-Content dist\install.log; throw "安装失败（$($r.ExitCode)）" }
          foreach ($f in "pinyin-engine.exe", "pinyin-settings.exe", "pinyin-tsf64.dll", "pinyin-tsf32.dll", "pinyin.ico", "pinyin.png", "data\pinyin.dict", "data\english.tsv", "data\pinyin.lm") {
            if (-not (Test-Path "$app\$f")) { throw "缺少 $f" }
          }
          if (-not (Test-Path "$tip\LanguageProfile\0x00000804")) { throw "输入法没注册" }
          if (-not (Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run" -Name PinyinIME -ErrorAction SilentlyContinue)) { throw "没有登录自动启动" }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { if (Get-Process pinyin-engine -ErrorAction SilentlyContinue) { $ok = $true; break }; Start-Sleep 1 }
          if (-not $ok) { throw "引擎没启动" }
          Start-Sleep 5
          if (-not (Get-Process pinyin-engine -ErrorAction SilentlyContinue)) { Get-Content "$env:APPDATA\PinyinIME\engine.log" -ErrorAction SilentlyContinue; throw "引擎启动后退出了" }
          Get-Content "$env:APPDATA\PinyinIME\engine.log" -ErrorAction SilentlyContinue
          Get-Process pinyin-engine | Format-Table Id, WorkingSet64, PrivateMemorySize64 | Out-Host

          $r = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          $r.WaitForExit(300000) | Out-Null
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$tip\LanguageProfile\0x00000804") { throw "卸载后输入法还在" }
          if (Get-Process pinyin-engine -ErrorAction SilentlyContinue) { throw "卸载后引擎还在运行" }
          if (Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run" -Name PinyinIME -ErrorAction SilentlyContinue) { throw "卸载后自动启动还在" }

      - name: 上传安装程序
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PinyinIME-Setup
          path: dist/PinyinIME-Setup-*.exe
          retention-days: 30
          compression-level: 0

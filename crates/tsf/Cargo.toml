[package]
name = "pinyin-tsf"
description = "Windows 输入法框架（TSF）里的输入法：每个程序里加载的那个很薄的 DLL"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "pinyin_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
pinyin-types = { path = "../types" }
pinyin-ipc = { path = "../ipc" }

[target."cfg(windows)".dependencies]
pinyin-winpipe = { version = "0.1.0", path = "../winpipe" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_IO", "Win32_UI_HiDpi", "Win32_System_Variant"] }
windows-core = "=0.62.2"
windows-numerics = "0.3"
